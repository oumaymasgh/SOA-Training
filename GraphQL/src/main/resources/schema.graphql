enum TypeModule {
    TRANSVERSAL
    PROFESSIONNEL
    RECHERCHE
}

type UniteEnseignement {
    code: Int
    domaine: String
    responsable: String
    credits: Int
    semestre: Int
}

type Module {
    matricule: String
    nom: String
    coefficient: Int
    volumeHoraire: Int
    type: TypeModule
}

type QueryResolver {
    allUEs: [UniteEnseignement]
    allModules: [Module]
}

type MutationResolver {
    addUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    addModule(
        matricule: String!
        libelle: String!
        coef: Int!
        volumeHoraire: Int!
        codeUE: Int!
        type: TypeModule!
    ): Boolean

    updateModule(
        matricule: String!
        libelle: String!
        coef: Int!
        volumeHoraire: Int!
        codeUE: Int!
        type: TypeModule!
    ): Module

    deleteModule(matricule: String!): Boolean
}

schema {
    query: QueryResolver
    mutation: MutationResolver
}